<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8fafc;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15" />
      <feOffset dx="0" dy="10" result="offsetblur" />
      <feComponentTransfer><feFuncA type="linear" slope="0.25" /></feComponentTransfer>
      <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <!-- Background glow -->
  <circle cx="300" cy="200" r="220" fill="#eef2ff" opacity="0.4" filter="blur(60px)" />
  <!-- Stars -->
  <path d="M150 110 l 5 -15 l 15 0 l -12 9 l 5 15 l -10 -7 z" fill="#ffd93d" filter="blur(2px)" />
  <path d="M125 165 l 4 -12 l 12 0 l -10 7 z" fill="#ffd93d" opacity="0.6" filter="blur(1px)" />
  <path d="M470 155 l 5 -15 l 15 0 l -12 9 l 5 15 l -10 -7 z" fill="#ffd93d" filter="blur(2px)" />
  <path d="M495 190 l 4 -12 l 12 0 l -10 7 z" fill="#ffd93d" opacity="0.6" filter="blur(1px)" />
  <!-- Page -->
  <rect x="160" y="60" width="280" height="280" rx="16" fill="url(#pageGrad)" filter="url(#shadow)" />
  <rect x="160" y="60" width="20" height="280" rx="8" fill="#e2e8f0" />
  <!-- Spiral binding -->
  <circle cx="170" cy="80" r="4" fill="#94a3b8" />
  <circle cx="170" cy="120" r="4" fill="#94a3b8" />
  <circle cx="170" cy="160" r="4" fill="#94a3b8" />
  <circle cx="170" cy="200" r="4" fill="#94a3b8" />
  <circle cx="170" cy="240" r="4" fill="#94a3b8" />
  <circle cx="170" cy="280" r="4" fill="#94a3b8" />
  <circle cx="170" cy="320" r="4" fill="#94a3b8" />
  <!-- Check badges -->
  <rect x="260" y="110" width="44" height="44" rx="10" fill="#6366f1" />
  <path d="M278 140 l -6 6 l -10 -10 l -3 3 l 13 13 l 24 -24 z" fill="white" />
  <rect x="260" y="175" width="44" height="44" rx="10" fill="#6366f1" />
  <path d="M278 205 l -6 6 l -10 -10 l -3 3 l 13 13 l 24 -24 z" fill="white" />
  <rect x="260" y="240" width="44" height="44" rx="10" fill="#6366f1" />
  <path d="M278 270 l -6 6 l -10 -10 l -3 3 l 13 13 l 24 -24 z" fill="white" />
  <!-- Lines -->
  <line x1="320" y1="125" x2="420" y2="125" stroke="#cbd5e1" stroke-width="2" />
  <line x1="320" y1="140" x2="400" y2="140" stroke="#cbd5e1" stroke-width="2" />
  <line x1="320" y1="190" x2="420" y2="190" stroke="#cbd5e1" stroke-width="2" />
  <line x1="320" y1="205" x2="390" y2="205" stroke="#cbd5e1" stroke-width="2" />
  <line x1="320" y1="255" x2="420" y2="255" stroke="#cbd5e1" stroke-width="2" />
  <line x1="320" y1="270" x2="400" y2="270" stroke="#cbd5e1" stroke-width="2" />
  <!-- Pen -->
  <path d="M410 180 q 20 10 30 40 l -10 30 q -5 20 -25 10 l -30 -20 z" fill="#f59e0b" filter="url(#shadow)" />
  <ellipse cx="425" cy="235" rx="8" ry="14" fill="#fbbf24" />
  <path d="M420 245 l 10 20 l 5 -5 z" fill="#ffffff" />
</svg>
