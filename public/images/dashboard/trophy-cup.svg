<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6d28d9;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15" />
      <feOffset dx="0" dy="10" result="offsetblur" />
      <feComponentTransfer><feFuncA type="linear" slope="0.25" /></feComponentTransfer>
      <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <!-- Background glow -->
  <circle cx="300" cy="200" r="260" fill="#eef2ff" opacity="0.4" filter="blur(70px)" />
  <!-- Stars -->
  <path d="M450 90 l 4 -12 l 12 0 l -10 7 z" fill="#f59e0b" filter="blur(2px)" opacity="0.9" />
  <path d="M520 130 l 4 -12 l 12 0 l -10 7 z" fill="#f59e0b" opacity="0.7" filter="blur(1px)" />
  <path d="M480 300 l 4 -12 l 12 0 l -10 7 z" fill="#f59e0b" opacity="0.8" filter="blur(1px)" />
  <path d="M150 140 l 4 -12 l 12 0 l -10 7 z" fill="#f59e0b" opacity="0.6" filter="blur(1px)" />
  <path d="M110 190 l 3 -10 l 10 0 l -8 6 z" fill="#f59e0b" opacity="0.5" filter="blur(1px)" />
  <!-- Cup -->
  <g transform="translate(250, 100)" filter="url(#shadow)">
    <ellipse cx="150" cy="60" rx="80" ry="30" fill="#c4b5fd" opacity="0.3" />
    <path d="M110 90 q 0 40 80 40 t 80 -40" fill="none" stroke="#8b5cf6" stroke-width="4" opacity="0.5" />
    <path d="M70 110 l 0 90 q 0 20 30 20 l 100 0 q 20 0 30 -20 l 0 -90 q -10 0 -30 0 l 0 50 q -20 0 -40 20 l -40 0 q -20 -20 -40 -20 l 0 -50 q -20 0 -40 0 z" fill="url(#cupGrad)" />
    <!-- Handle -->
    <path d="M150 110 q 40 0 60 60 q 0 40 -60 40" fill="none" stroke="#8b5cf6" stroke-width="20" stroke-linecap="round" />
    <path d="M150 110 q 40 0 60 60 q 0 40 -60 40" fill="none" stroke="#a855f7" stroke-width="8" stroke-linecap="round" opacity="0.6" />
    <!-- Star on cup -->
    <path d="M130 140 l 4 12 l 14 0 l -11 8 l 4 12 l -12 -6 l -12 6 l 4 -12 l -11 -8 l 14 0 l 4 -12 z" fill="#fbbf24" />
  </g>
  <!-- Base shadow -->
  <ellipse cx="300" cy="310" rx="100" ry="20" fill="#000000" opacity="0.1" filter="blur(10px)" />
</svg>
