<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="medalGold" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="medalPurple" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7e22ce;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="medalBlue" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" />
      <feOffset dx="0" dy="8" result="offsetblur" />
      <feComponentTransfer><feFuncA type="linear" slope="0.25" /></feComponentTransfer>
      <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <circle cx="300" cy="200" r="240" fill="#f8fafc" filter="blur(80px)" opacity="0.5" />
  <!-- Swirl -->
  <path d="M150 300 q 150 -150 300 0 q -150 -150 -300 0" fill="none" stroke="#e2e8f0" stroke-width="4" />
  <!-- Gold medal -->
  <g transform="translate(160, 160)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="60" fill="url(#medalGold)" />
    <circle cx="0" cy="0" r="52" fill="none" stroke="#fcd34d" stroke-width="3" />
    <path d="M-22 -8 l 6 22 l 18 -6 l -14 10 l 2 22 l -16 -12 l -16 12 l 2 -22 l -14 -10 l 18 6 l 6 -22 z" fill="#fbbf24" />
    <path d="M-28 -14 q 0 28 28 0 q 0 -28 -28 0" fill="#fcd34d" opacity="0.3" />
    <rect x="-8" cy="0" width="16" height="40" fill="#d97706" transform="translate(-8, -50)" />
    <path d="M-8 -90 l 0 10 l 16 0 l 0 -10 z" fill="#d97706" />
  </g>
  <!-- Purple medal -->
  <g transform="translate(300, 140)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="70" fill="url(#medalPurple)" />
    <circle cx="0" cy="0" r="62" fill="none" stroke="#c4b5fd" stroke-width="3" />
    <path d="M-26 -10 l 7 26 l 22 -7 l -16 12 l 2 26 l -19 -14 l -19 14 l 2 -26 l -16 -12 l 22 7 l 7 -26 z" fill="#e879f9" />
    <path d="M-32 -16 q 0 32 32 0 q 0 -32 -32 0" fill="#c4b5fd" opacity="0.3" />
    <rect x="-10" cy="0" width="20" height="48" fill="#7e22ce" transform="translate(-10, -60)" />
    <path d="M-10 -108 l 0 12 l 20 0 l 0 -12 z" fill="#7e22ce" />
  </g>
  <!-- Blue medal -->
  <g transform="translate(440, 180)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="55" fill="url(#medalBlue)" />
    <circle cx="0" cy="0" r="47" fill="none" stroke="#93c5fd" stroke-width="3" />
    <path d="M-20 -7 l 5 20 l 16 -5 l -12 9 l 2 20 l -14 -11 l -14 11 l 2 -20 l -12 -9 l 16 5 l 5 -20 z" fill="#60a5fa" />
    <path d="M-25 -12 q 0 25 25 0 q 0 -25 -25 0" fill="#93c5fd" opacity="0.3" />
    <rect x="-7" cy="0" width="14" height="36" fill="#1d4ed8" transform="translate(-7, -45)" />
    <path d="M-7 -81 l 0 9 l 14 0 l 0 -9 z" fill="#1d4ed8" />
  </g>
</svg>
